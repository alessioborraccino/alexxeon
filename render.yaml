services:
  - type: web
    name: alexxeon
    runtime: static
    buildCommand: npm ci && npm test && npm run build && npm run check:export
    staticPublishPath: ./out
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /full-logo-white.png
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /og-image.jpg
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
